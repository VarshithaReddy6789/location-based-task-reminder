<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GeoTask</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <!-- Visual Side -->
  <div class="auth-visual">
    <div class="globe">
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
    </div>
    <div class="auth-visual-text">
      <h2>Tasks that find you.</h2>
      <p>Get reminded automatically when you arrive at the right place — no timers needed.</p>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-logo">
      <span>●</span> Geo<span>Task</span>
    </div>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue</p>

      <div id="error-msg" style="display:none; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.25); border-radius:8px; padding:0.7rem 1rem; font-size:0.85rem; color:var(--danger); margin-bottom:1rem;"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary" id="login-btn" style="margin-top:0.5rem;">
        Sign In
      </button>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  (async () => {
    const user = await getUser();
    if (user) window.location.href = 'dashboard.html';
  })();

  const loginBtn = document.getElementById('login-btn');
  const errMsg   = document.getElementById('error-msg');

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') loginBtn.click();
  });

  loginBtn.addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errMsg.style.display = 'none';

    if (!email || !password) {
      errMsg.textContent = 'Please enter your email and password.';
      errMsg.style.display = 'block';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> Signing in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errMsg.textContent = error.message;
      errMsg.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    } else {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>

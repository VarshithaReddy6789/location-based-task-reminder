<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — GeoTask</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <!-- Visual Side -->
  <div class="auth-visual">
    <div class="globe">
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
      <div class="globe-dot"></div>
    </div>
    <div class="auth-visual-text">
      <h2>Location-aware tasks.</h2>
      <p>Pin tasks to any location. GeoTask reminds you the moment you arrive — hands-free.</p>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-logo">
      <span>●</span> Geo<span>Task</span>
    </div>

    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Start managing location-based tasks today</p>

      <div id="error-msg" style="display:none; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.25); border-radius:8px; padding:0.7rem 1rem; font-size:0.85rem; color:var(--danger); margin-bottom:1rem;"></div>
      <div id="success-msg" style="display:none; background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.2); border-radius:8px; padding:0.7rem 1rem; font-size:0.85rem; color:var(--accent); margin-bottom:1rem;"></div>

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="fname" placeholder="Arjun" autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lname" placeholder="Sharma" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password" />
      </div>

      <button class="btn btn-primary" id="register-btn" style="margin-top:0.5rem;">
        Create Account
      </button>

      <div class="auth-switch">
        Already have an account? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
  (async () => {
    const user = await getUser();
    if (user) window.location.href = 'dashboard.html';
  })();

  const registerBtn = document.getElementById('register-btn');
  const errMsg      = document.getElementById('error-msg');
  const successMsg  = document.getElementById('success-msg');

  registerBtn.addEventListener('click', async () => {
    const fname    = document.getElementById('fname').value.trim();
    const lname    = document.getElementById('lname').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    errMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!fname || !email || !password) {
      errMsg.textContent = 'Please fill in all required fields.';
      errMsg.style.display = 'block'; return;
    }
    if (password.length < 6) {
      errMsg.textContent = 'Password must be at least 6 characters.';
      errMsg.style.display = 'block'; return;
    }
    if (password !== confirm) {
      errMsg.textContent = 'Passwords do not match.';
      errMsg.style.display = 'block'; return;
    }

    registerBtn.disabled = true;
    registerBtn.innerHTML = '<span class="spinner"></span> Creating account…';

    const { error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: `${fname} ${lname}`.trim() }
      }
    });

    if (error) {
      errMsg.textContent = error.message;
      errMsg.style.display = 'block';
      registerBtn.disabled = false;
      registerBtn.textContent = 'Create Account';
    } else {
      // Auto sign-in and redirect
      const { error: loginErr } = await sb.auth.signInWithPassword({ email, password });
      if (!loginErr) {
        window.location.href = 'dashboard.html';
      } else {
        successMsg.textContent = 'Account created! Please check your email to verify, then sign in.';
        successMsg.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      }
    }
  });
</script>
</body>
</html>
